<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1E3A8A" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with shadow -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner subtle border glow -->
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4" />

  <!-- Stylized Globe / Hub Icon -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer Globe Circle -->
    <circle r="128" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />

    <!-- Equator and parallels -->
    <ellipse rx="128" ry="54" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="18" />
    <line x1="-128" y1="0" x2="128" y2="0" stroke="rgba(255,255,255,0.7)" stroke-width="16" />

    <!-- Prime Meridian -->
    <ellipse rx="58" ry="128" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="18" />
    <line x1="0" y1="-128" x2="0" y2="128" stroke="rgba(255,255,255,0.7)" stroke-width="16" />

    <!-- Floating Bookmark / Star Pin Badge on bottom right -->
    <g transform="translate(64, 64)">
      <circle r="52" fill="#F59E0B" stroke="#FFFFFF" stroke-width="8" />
      <!-- Star in badge -->
      <path d="M 0 -24 L 7 -7 L 25 -6 L 11 7 L 16 24 L 0 13 L -16 24 L -11 7 L -25 -6 L -7 -7 Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>
